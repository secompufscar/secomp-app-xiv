name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: app-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: TypeScript and web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run verify
        env:
          CERTIFICATE_TEST_OUTPUT: test-results/certificate-pdf
      - run: npx playwright install --with-deps chromium
      - run: npm run test:certificates:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: certificate-test-evidence
          path: test-results/
          retention-days: 7
